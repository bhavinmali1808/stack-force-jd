<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Blue rounded rectangle background -->
  <rect x="4" y="4" width="92" height="92" rx="18" ry="18" fill="#4361EE"/>

  <!-- Chain link left -->
  <rect x="16" y="32" width="44" height="36" rx="14" ry="14" fill="none" stroke="white" stroke-width="10"/>

  <!-- Chain link right -->
  <rect x="40" y="32" width="44" height="36" rx="14" ry="14" fill="none" stroke="white" stroke-width="10"/>

  <!-- Cover middle overlap so they look interlocked -->
  <rect x="55" y="36" width="18" height="28" fill="#4361EE"/>

  <!-- Re-draw right link front arc -->
  <path d="M84 45 Q84 33 72 33 Q60 33 58 43" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <path d="M84 55 Q84 67 72 67 Q60 67 58 57" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- "Resuming.io" text -->
  <text x="115" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#0A0A0A" letter-spacing="-1">Resuming.io</text>
</svg>
